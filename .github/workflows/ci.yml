name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here writes to the repository.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Only 8.4 and up. Pest 5 requires PHP ^8.4, so the suite cannot run on
        # the 8.3 floor the package itself supports. The floor job below checks
        # what that constraint actually promises.
        php: ['8.4']

    steps:
      # Third-party actions are pinned to a full commit SHA, never a tag. A tag
      # can be re-pointed at malicious code by whoever controls the action's
      # repository, which is how tj-actions/changed-files leaked CI secrets out
      # of thousands of repositories in March 2025. The comment records which
      # release each SHA is, because the SHA alone tells a reader nothing.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The suite lives in example/, a host app that installs the package
      # through a path repository. Testing the package in a real Laravel app is
      # the point: it catches what a standalone test harness cannot.
      #
      # These run from inside example/ rather than with --working-dir, because
      # `artisan test` spawns Pest at a path relative to the current directory
      # and cannot find it from anywhere else.
      - name: Install dependencies
        working-directory: example
        run: composer install --no-interaction --no-progress

      - name: Prepare the app
        working-directory: example
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the suite
        working-directory: example
        run: php artisan test

  floor:
    name: PHP 8.3 floor
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # composer.json promises `"php": "^8.3"`. The suite cannot verify that,
      # because Pest needs 8.4, so verify the two halves the promise is made of:
      # the code parses on 8.3, and someone on 8.3 can install the thing.
      - name: The package parses on 8.3
        run: |
          find src config routes database -type f \( -name '*.php' -o -name '*.stub' \) \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: A consumer on 8.3 can install it
        run: |
          mkdir -p "$RUNNER_TEMP/floor"
          cd "$RUNNER_TEMP/floor"
          cat > composer.json <<JSON
          {
              "require": {},
              "minimum-stability": "stable",
              "repositories": [
                  { "type": "path", "url": "$GITHUB_WORKSPACE" }
              ]
          }
          JSON
          composer require safi/filament-atelier:@dev \
            --no-interaction --no-progress --dry-run

  lint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Pint comes from the example app's dependencies rather than a second
      # install at the root, because one install is enough.
      - name: Install dependencies
        working-directory: example
        run: composer install --no-interaction --no-progress

      - name: Check formatting
        run: example/vendor/bin/pint --test src
